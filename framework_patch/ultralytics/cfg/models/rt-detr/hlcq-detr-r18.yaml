# Joint model: CP2Q + HFPD + Local Contrast-Neighborhood Consensus (LCNC).
# HFPD preserves fine detail, LCNC suppresses isolated responses, and CP2Q detects on P2-P5.
nc: 1
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, null, false, 'relu']]
  - [-1, 1, ConvNormLayer, [32, 3, 1, null, false, 'relu']]
  - [-1, 1, ConvNormLayer, [64, 3, 1, null, false, 'relu']]
  - [-1, 1, HighFrequencyPreservingDownsample, [64, 0.05]]
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']]   # 4: P2
  - [-1, 1, LocalContrastNeighborhoodConsensus, [64, 5, 0.05, 4.0]]  # 5: refined P2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']]  # 6: P3
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']]  # 7: P4
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']]  # 8: P5

head:
  - [8, 1, Conv, [256, 1, 1, null, 1, 1, false]]
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]]                        # 11: Y5
  - [-1, 1, nn.Upsample, [null, 2, 'nearest']]
  - [7, 1, Conv, [256, 1, 1, null, 1, 1, false]]
  - [[12, 13], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 1, 1]]                        # 16: Y4
  - [-1, 1, nn.Upsample, [null, 2, 'nearest']]
  - [6, 1, Conv, [256, 1, 1, null, 1, 1, false]]
  - [[17, 18], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]                        # 20: P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[21, 16], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]                        # 23: P4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[24, 11], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]                        # 26: P5

  - [20, 1, Conv, [64, 1, 1]]                         # 27: compressed P3
  - [-1, 1, nn.Upsample, [null, 2, 'nearest']]
  - [5, 1, Conv, [64, 1, 1, null, 1, 1, false]]       # 29: refined P2 lateral
  - [[28, 29], 1, Concat, [1]]
  - [-1, 1, RepC3, [64, 0.5]]                         # 31: compact P2
  - [[31, 20, 23, 26], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
